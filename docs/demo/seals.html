<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seal stickers</title>
<!-- Printable seal codes for the demo (docs/spec.md section 8). Open in a browser and print at 100%. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --ink: #111; --line: #999; --paper: #fff; }
  body { margin: 16px; font-family: system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 16px; font-size: 13px; }
  .sheet { display: flex; flex-wrap: wrap; gap: 16px; }
  .sticker { width: 62mm; border: 1px dashed var(--line); padding: 4mm; box-sizing: border-box; text-align: center; break-inside: avoid; }
  .sticker .code { display: flex; justify-content: center; margin: 2mm 0; }
  .sticker strong { display: block; font-size: 16px; }
  .sticker span { display: block; font-size: 12px; }
  @media print { p { display: none; } .sticker { border-color: #ccc; } }
</style>
</head>
<body>
<h1>Seal stickers · DUMMY · not real sources</h1>
<p>C-12 has two copies: one for the prop camera, one for the cheat in the demo. Each code reads <code>CS1S:&lt;camera&gt;:&lt;seal&gt;</code> (docs/sync.md A.3).</p>
<div class="sheet" id="sheet"></div>
<script>
  const seals = [
    ["C-12", "S-40117", "IR-0457 · Ir-192", "on the camera"],
    ["C-12", "S-40117", "IR-0457 · Ir-192", "copy for the cheat"],
    ["C-07", "S-40102", "IR-0391 · Ir-192", ""],
    ["C-15", "S-40125", "SE-0112 · Se-75", ""],
  ];
  const sheet = document.getElementById("sheet");
  for (const [camera, seal, source, note] of seals) {
    const div = document.createElement("div");
    div.className = "sticker";
    div.innerHTML = `<strong>${camera} · seal ${seal}</strong><span>${source}</span><div class="code"></div><span>${note || "&nbsp;"}</span>`;
    sheet.appendChild(div);
    new QRCode(div.querySelector(".code"), { text: `CS1S:${camera}:${seal}`, width: 160, height: 160, correctLevel: QRCode.CorrectLevel.M });
  }
</script>
</body>
</html>
